<!doctype html>
<meta charset="utf-8">
<title>MHGU Fishing — armor bench</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Relative paths resolve against the app folder so game.js finds its data. -->
<base href="../docs/">
<style>
  /* Lives OUTSIDE docs/ on purpose. GitHub Pages serves docs/ and nothing else,
     so this cannot reach a player however it is linked. It reads the game's real
     EFFECTS and ARMOR_LINES for names and ids, so nothing here can go stale. */
  :root{
    --bg:#14161b; --card:#1b1e25; --line:#ffffff1f; --ink:#e9e9e9; --dim:#ffffff8c;
    --helm:#3f7d63; --chest:#3f6a8d; --waist:#7d5f3f; --set:#6d4f7d;
    --warn:#d08a3a; --bad:#c9524a; --good:#4fbf8b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
  /* The right column hugs the grid now that the grid hugs its content, so the
     page is as wide as it needs to be and no wider. */
  .wrap{max-width:1500px;margin:0 auto;padding:16px;display:grid;gap:14px;
        grid-template-columns:210px minmax(0,max-content);justify-content:start}
  h1{grid-column:1/-1;margin:0;font-size:17px;font-weight:600}
  h1 small{font-weight:400;opacity:.55;font-size:12px;margin-left:8px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:12px}
  /* Stays beside the grid however far down the page you go. */
  .wrap > .card:first-of-type{position:sticky;top:16px;align-self:start}
  h2{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim)}

  /* ── Palette ─────────────────────────────────────────────────────────── */
  .pal{display:grid;gap:3px;max-height:calc(100vh - 150px);overflow-y:auto}
  .chip{
    background:#232833;border:1px solid var(--line);border-radius:6px;
    padding:4px 8px;font-size:12.5px;cursor:grab;user-select:none;
    display:flex;justify-content:space-between;align-items:center;gap:6px;
  }
  .chip:active{cursor:grabbing}
  .chip.dragging{opacity:.4}
  .chip small{color:var(--dim);font-size:10.5px;white-space:nowrap}
  .chip.proposed{border-style:dashed;border-color:#ffffff3d;background:#1e2530}
  .chip.unused{border-color:var(--warn)}

  /* ── Rank tabs and buttons ───────────────────────────────────────────── */
  .segs{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .segs button{font:inherit;font-size:13px;padding:6px 16px;background:#1b1e25;
               color:var(--dim);border:0;border-right:1px solid var(--line);cursor:pointer}
  .segs button:last-child{border-right:0}
  .segs button[aria-pressed="true"]{background:#2f4a3d;color:var(--ink);font-weight:600}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  button.act{background:#2b303b;color:var(--ink);border:1px solid #ffffff2e;
             border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer}
  button.act:hover{background:#353b48}
  input[type="search"]{background:#12141a;color:var(--ink);border:1px solid #ffffff2e;
                       border-radius:6px;padding:6px 10px;font:inherit;font-size:13px;min-width:180px}
  .count{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}

  /* ── The grid ────────────────────────────────────────────────────────── */
  /* Seventy-one lines is taller than any screen, and the palette you drag FROM
     sits beside it — so if the page scrolls, the source leaves the viewport and
     the lines further down cannot be reached at all. The grid gets its own
     scroller instead, and the palette stays where it is. */
  .grid-scroll{max-height:calc(100vh - 210px);min-height:320px;overflow:auto;
               padding-right:4px}
  /* Columns size to what is in them rather than splitting the width. As 1fr they
     stayed wide no matter how small the entries got, and the grid sprawled across
     the screen holding mostly air. `justify-content:start` stops the whole grid
     stretching once the columns have what they need. */
  .grid{display:grid;grid-template-columns:118px repeat(3,minmax(72px,max-content)) minmax(84px,max-content);
        gap:5px;justify-content:start}
  .ghead{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);
         padding:4px 4px 4px;position:sticky;top:0;z-index:2;background:var(--card)}
  .lname{display:flex;align-items:center;font-weight:600;font-size:13px;color:var(--dim)}
  /* The eight whose parts you FISH. Everything else is Trader-only. */
  .lname.fished{color:var(--ink)}
  .lname{flex-direction:column;align-items:flex-start;gap:3px;justify-content:center}
  .lname .ln{display:flex;align-items:center}
  .lname.fished .ln::before{content:'';width:5px;height:5px;border-radius:50%;
                            background:var(--good);margin-right:6px;flex:none}
  /* The lowest rank this set exists at. Below it the row has no pieces. */
  .floor{display:flex;gap:2px}
  .floor button{width:18px;height:16px;padding:0;line-height:1;font-size:10px;
                background:#232833;color:var(--dim);border:1px solid var(--line);
                border-radius:3px;cursor:pointer}
  .floor button.on{background:#2f4a3d;color:var(--ink);border-color:#3f8d61;font-weight:600}
  .cell.shut{border-style:solid;border-color:#ffffff12;background:#ffffff05;opacity:.45}
  .cell{
    border:1px dashed var(--line);border-radius:7px;padding:4px;min-height:40px;
    display:flex;flex-wrap:wrap;align-items:flex-start;align-content:flex-start;gap:3px;
  }
  .cell.over{border-style:solid;background:#ffffff0f}
  .cell.helm{border-left:3px solid var(--helm)}
  .cell.chest{border-left:3px solid var(--chest)}
  .cell.waist{border-left:3px solid var(--waist)}
  .cell.setb{border-left:3px solid var(--set)}
  /* Was 'drop a skill', which at ~60px set a floor under every column. */
  .cell .none{font-size:12px;color:#ffffff2e;margin:auto;line-height:1}
  /* Entries hug their text and sit side by side, so a piece carrying two skills
     costs one row rather than two and more of the bench fits on screen. */
  .ent{
    display:inline-flex;align-items:center;gap:3px;background:#232833;
    border:1px solid var(--line);border-radius:5px;padding:1px 3px;font-size:11px;
    max-width:100%;
  }
  .ent .nm{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
           white-space:nowrap;cursor:grab}
  .ent .lv{flex:none;min-width:15px;height:15px;line-height:1;padding:0 3px;font-size:10.5px;
           background:#2f4a3d;color:var(--ink);border:1px solid #ffffff2e;border-radius:3px;
           cursor:pointer;font-variant-numeric:tabular-nums;font-weight:600}
  .ent .lv:hover{background:#3c5f4e}
  .ent .rm{flex:none;background:none;border:0;color:#ffffff5c;cursor:pointer;
           font-size:12px;line-height:1;padding:0 1px}
  .ent .rm:hover{color:var(--bad)}

  /* ── Checks and output ───────────────────────────────────────────────── */
  .warn{border-left:3px solid var(--warn);padding:5px 10px;margin:3px 0;
        font-size:12.5px;background:#ffffff0a}
  .warn.bad{border-left-color:var(--bad)}
  .warn.ok{border-left-color:var(--good)}
  pre{margin:0;white-space:pre;overflow-x:auto;font:11.5px/1.5 ui-monospace,Menlo,Consolas,monospace;
      background:#12141a;border:1px solid var(--line);border-radius:7px;padding:10px;
      max-height:340px;overflow-y:auto}
  table.tot{width:100%;border-collapse:collapse;font-size:12px}
  table.tot th{text-align:left;font-weight:600;color:var(--dim);font-size:10px;
               text-transform:uppercase;letter-spacing:.08em;padding:2px 6px}
  table.tot td{padding:2px 6px;border-top:1px solid #ffffff12;vertical-align:top}
  table.tot td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
  .over5{color:var(--bad);font-weight:600}
</style>

<div class="wrap">
  <h1>Armor bench
    <small>helm &middot; chest &middot; waist &mdash; drag a skill into a piece, set its level.
      A dot marks the eight whose parts you fish; the rest come from the Trader.</small></h1>

  <div class="card">
    <h2>Skills</h2>
    <div class="pal" id="pal"></div>
  </div>

  <div style="display:grid;gap:14px;min-width:0">
    <div class="card">
      <div class="row">
        <div class="segs" role="group" id="rankSegs">
          <button data-rank="Low" aria-pressed="true">Low</button>
          <button data-rank="High" aria-pressed="false">High</button>
          <button data-rank="G" aria-pressed="false">G</button>
        </div>
        <div class="segs" role="group" id="sortSegs" title="line order">
          <button data-sort="water" aria-pressed="true">Water</button>
          <button data-sort="rank" aria-pressed="false">Rank</button>
          <button data-sort="name" aria-pressed="false">Name</button>
        </div>
        <input type="search" id="lineFilter" placeholder="find a monster&hellip;" autocomplete="off">
        <span id="shownCount" class="count"></span>
        <button class="act" id="applyAll">Copy rank to all</button>
        <button class="act" id="clear">Clear all</button>
        <button class="act" id="copy">Copy output</button>
      </div>
      <div class="grid-scroll"><div class="grid" id="grid"></div></div>
    </div>

    <div class="card">
      <h2>What a full set gives</h2>
      <div style="overflow-x:auto"><table class="tot" id="totals"></table></div>
    </div>

    <div class="card">
      <h2>Checks</h2>
      <div id="checks"></div>
    </div>

    <div class="card">
      <h2>Output</h2>
      <pre id="out"></pre>
    </div>
  </div>
</div>

<!-- Loaded with a fresh query every time. A dev tool that reads the game's data
     while that data is being edited must never serve a cached copy: an hour was
     lost to a bench showing eight monsters while game.js had eleven. -->
<script>
  (function () {
    var t = '?t=' + Date.now();
    var files = ['data/ores.js', 'data/fish.js', 'data/locales.js', 'data/meals.js',
                 'data/canteen.js', 'game.js',
                 '../tools/skills-data.js', '../tools/armor.js'];
    for (var i = 0; i < files.length; i++)
      document.write('<script src="' + files[i] + t + '"><\/script>');
  })();
</script>
