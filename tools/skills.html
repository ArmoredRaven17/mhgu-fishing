<!doctype html>
<meta charset="utf-8">
<title>MHGU Fishing — skill list</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<base href="../docs/">
<style>
  /* Lives OUTSIDE docs/ with the benches, so Pages cannot serve it. Reads the
     game's real EFFECTS to say which skills already exist, and shares its skill
     list with the armor bench so the two cannot drift apart. */
  :root{
    --bg:#14161b; --card:#1b1e25; --line:#ffffff1f; --ink:#e9e9e9; --dim:#ffffff8c;
    --good:#4fbf8b; --warn:#d08a3a; --accent:#7fb3d5;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
  .wrap{max-width:1040px;margin:0 auto;padding:20px 16px 60px}
  h1{margin:0 0 4px;font-size:19px;font-weight:600}
  .lede{margin:0 0 16px;color:var(--dim);font-size:13px;max-width:70ch}
  .lede a{color:var(--accent)}

  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
  .segs{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .segs button{font:inherit;font-size:13px;padding:6px 14px;background:#1b1e25;
               color:var(--dim);border:0;border-right:1px solid var(--line);cursor:pointer}
  .segs button:last-child{border-right:0}
  .segs button[aria-pressed="true"]{background:#2f4a3d;color:var(--ink);font-weight:600}
  input[type="search"]{background:#12141a;color:var(--ink);border:1px solid #ffffff2e;
                       border-radius:6px;padding:6px 10px;font:inherit;font-size:13px;min-width:200px}
  .tally{margin-left:auto;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}

  h2{margin:22px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.09em;
     color:var(--dim);border-bottom:1px solid var(--line);padding-bottom:5px}
  h2 span{text-transform:none;letter-spacing:0;opacity:.65;font-weight:400;margin-left:6px}
  table{width:100%;border-collapse:collapse}
  td{padding:7px 8px;border-bottom:1px solid #ffffff10;vertical-align:top}
  td.nm{width:150px;font-weight:600;white-space:nowrap}
  td.st{width:96px}
  td.at{color:var(--dim);font-size:13px}
  td.at code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;
             background:#ffffff0d;padding:1px 4px;border-radius:3px}
  .pill{display:inline-block;font-size:10px;text-transform:uppercase;letter-spacing:.07em;
        padding:2px 7px;border-radius:10px;border:1px solid var(--line);color:var(--dim)}
  .pill.live{border-color:var(--good);color:var(--good)}
  .pill.idea{border-color:var(--warn);color:var(--warn)}
  .key{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:#ffffff5c;
       display:block;font-weight:400}
  .blurb{color:var(--dim);font-size:12.5px;font-style:italic;display:block;margin-top:2px}
  .none{padding:20px;text-align:center;color:var(--dim);font-style:italic}
</style>

<div class="wrap">
  <h1>Skill list</h1>
  <p class="lede">
    Working names &mdash; one word for the thing each skill affects. Three keep their
    own names because their effects are not a simple dial. <b>Live</b> means the game
    already reads it; <b>idea</b> means nothing does yet. Assign them in the
    <a href="../tools/armor.html">armor bench</a>.
  </p>

  <div class="bar">
    <div class="segs" role="group" id="showSegs">
      <button data-show="all" aria-pressed="true">All</button>
      <button data-show="live" aria-pressed="false">Live</button>
      <button data-show="idea" aria-pressed="false">Ideas</button>
    </div>
    <input type="search" id="q" placeholder="find a skill&hellip;" autocomplete="off">
    <span class="tally" id="tally"></span>
  </div>

  <div id="out"></div>
</div>

<script>
  (function () {
    var t = '?t=' + Date.now();
    var files = ['data/ores.js', 'data/fish.js', 'data/locales.js', 'data/meals.js',
                 'data/canteen.js', 'data/armorlines.js', 'game.js', '../tools/skills-data.js'];
    for (var i = 0; i < files.length; i++)
      document.write('<script src="' + files[i] + t + '"><\/script>');
  })();
</script>

<script>
  (function () {
    const S = window.MF_SKILLS, G = window.MF_GAME;
    const el = id => document.getElementById(id);
    let show = 'all', q = '';

    // A shipped skill already carries a description in the game; showing it here
    // saves reading two files to learn what one does.
    const blurbOf = k => {
      const e = G.EFFECTS[k];
      if (!e || !e.blurbs || !e.blurbs.length) return '';
      return e.blurbs[e.blurbs.length - 1];
    };

    function render() {
      const term = q.trim().toLowerCase();
      const rows = S.list.filter(s => {
        const live = S.isShipped(s.k);
        if (show === 'live' && !live) return false;
        if (show === 'idea' && live) return false;
        return !term || s.name.toLowerCase().includes(term)
          || s.k.toLowerCase().includes(term) || s.at.toLowerCase().includes(term);
      });

      el('out').innerHTML = rows.length ? S.groups.map(g => {
        const inGroup = rows.filter(s => s.group === g);
        if (!inGroup.length) return '';
        return `<h2>${g}<span>${inGroup.length}</span></h2><table>` + inGroup.map(s => {
          const live = S.isShipped(s.k);
          const blurb = live ? blurbOf(s.k) : '';
          return `<tr>`
            + `<td class="nm">${s.name}<span class="key">${s.k}</span></td>`
            + `<td class="st"><span class="pill ${live ? 'live' : 'idea'}">`
            + `${live ? 'live' : 'idea'}</span></td>`
            + `<td class="at">${s.at.replace(/([A-Z_]+\.[A-Za-z]+|[A-Z_]{4,})/g, '<code>$1</code>')}`
            + (blurb ? `<span class="blurb">&ldquo;${blurb}&rdquo;</span>` : '')
            + `</td></tr>`;
        }).join('') + `</table>`;
      }).join('') : `<div class="none">Nothing matches that.</div>`;

      const live = S.list.filter(s => S.isShipped(s.k)).length;
      el('tally').textContent = `${rows.length} shown · ${S.list.length} total · `
        + `${live} live, ${S.list.length - live} ideas`;
    }

    el('showSegs').addEventListener('click', e => {
      const b = e.target.closest('[data-show]');
      if (!b) return;
      show = b.dataset.show;
      for (const x of el('showSegs').querySelectorAll('[data-show]'))
        x.setAttribute('aria-pressed', String(x === b));
      render();
    });
    el('q').addEventListener('input', e => { q = e.target.value; render(); });
    render();
  })();
</script>
