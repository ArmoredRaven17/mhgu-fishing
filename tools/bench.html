<!doctype html>
<meta charset="utf-8">
<title>MHGU Fishing — reel bench</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Everything relative resolves against the app folder, so fishing.js finds
     its fish and monster icons without knowing the bench exists. -->
<base href="../docs/">
<link rel="stylesheet" href="styles.css?v=268">
<style>
  /* Lives OUTSIDE docs/ on purpose. GitHub Pages serves docs/ and nothing else,
     so a debug page in here cannot reach a player however it is linked. It loads
     the game's own data and fishing.js across the boundary and drives the real
     pond, so what it measures is what the game does. */
  body{margin:0;background:#14161b;color:#e9e9e9;font:14px/1.45 system-ui,sans-serif}
  .wrap{max-width:1100px;margin:0 auto;padding:16px;display:grid;gap:14px;
        grid-template-columns:290px minmax(0,1fr)}
  h1{grid-column:1/-1;margin:0;font-size:17px;font-weight:600;letter-spacing:.02em}
  h1 small{font-weight:400;opacity:.55;font-size:12px;margin-left:8px}
  .card{background:#1b1e25;border:1px solid #ffffff1f;border-radius:9px;padding:12px}
  label{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;
        align-items:center;margin-bottom:6px;font-size:12.5px}
  select,input{background:#12141a;color:#eee;border:1px solid #ffffff2e;
               border-radius:5px;padding:3px 6px;font-size:12.5px;width:100%}
  button{background:#2b303b;color:#eee;border:1px solid #ffffff2e;border-radius:6px;
         padding:6px 12px;font-size:13px;cursor:pointer}
  button:hover{background:#353b48}
  button.go{background:#2f6d4a;border-color:#3f8d61}
  .row{display:flex;gap:8px;margin-top:8px}
  .row button{flex:1}
  .nums{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;margin-top:10px;
        padding-top:9px;border-top:1px solid #ffffff1f;font-variant-numeric:tabular-nums;
        font-size:12.5px}
  .nums b{grid-column:1/-1;font-size:13px}
  .nums span:nth-child(odd){opacity:.6}
  .tally{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12.5px;
         font-variant-numeric:tabular-nums}
  .tally i{font-style:normal;opacity:.6}
  .log{max-height:190px;overflow:auto;font-size:12px;margin-top:8px;
       display:grid;gap:2px;font-variant-numeric:tabular-nums}
  .log div{opacity:.85}
  .log .win{color:#7fd18d}
  .log .lose{color:#e2907f}
  .pondwrap{display:grid;gap:10px}
  .modal{position:fixed;inset:0;background:#000c;display:flex;align-items:center;
    justify-content:center;padding:24px;z-index:50}
  .modal.hidden{display:none}
  .modal-box{background:#1b1b1e;border:1px solid #ffffff26;border-radius:10px;
    max-width:900px;width:100%;max-height:85vh;display:flex;flex-direction:column}
  .modal-head{display:flex;align-items:center;justify-content:space-between;
    padding:10px 14px;border-bottom:1px solid #ffffff1a}
  #armorBody{overflow:auto;padding:12px 14px}
</style>

<div class="wrap">
  <h1>Reel bench <small>drives the real pond — none of this is in the game</small></h1>

  <div class="card">
    <label>Fish <select id="fish"></select></label>
    <label>Variety <select id="ore"></select></label>
    <label>Monster <select id="monster"></select></label>
    <label>HR <input id="hr" type="number" min="1" max="13" value="12"></label>
    <label>Rod <select id="rod"></select></label>
    <label>Rod Lv <input id="rodLvl" type="number" min="0" max="5" value="0"></label>
    <!-- Three slots, because armor is three pieces now and the whole point of
         the rework is that they need not agree. Mix them here to see what a
         mixed set actually does to a fish. -->
    <label>Helm <select id="armorHelm"></select></label>
    <label>Chest <select id="armorChest"></select></label>
    <label>Waist <select id="armorWaist"></select></label>
    <label>Armor Lv <input id="armorLvl" type="number" min="0" max="5" value="0"></label>
    <label title="Set all three to the same line and rank">
      <button id="wholeSet" type="button">whole set from helm</button></label>
    <label>Locale <select id="locale"></select></label>
    <label>Hot Drink <input id="hotDrink" type="checkbox"></label>
    <label>Cool Drink <input id="coolDrink" type="checkbox"></label>
    <label>Pool <select id="pool">
      <option value="forced">forced &mdash; one variety</option>
      <option value="natural">natural &mdash; the locale's own</option>
    </select></label>
    <label>Bait <select id="bait"></select></label>
    <label>School <input id="school" type="number" min="1" max="12" value="6"></label>
    <div class="row">
      <button id="cast" class="go">Cast</button>
      <button id="reset">Clear tally</button>
      <button id="sweep">Sweep rods</button>
      <button id="listArmor">Armor skills&hellip;</button>
      <button id="sightings">Sample sightings</button>
    </div>
  </div>

  <div class="card">
    <div class="nums" id="nums"></div>
    <div class="nums" id="worn"></div>
    <div class="nums" id="poolInfo"></div>
  </div>

  <div class="pondwrap">
    <div class="card">
      <div id="castArea"><p id="castPrompt" style="margin:0;opacity:.7">Pick a fish and cast.</p></div>
      <div id="reel" class="reel hidden">
        <div id="pond" class="pond"></div>
        <div id="tensionWrap" class="tension hidden">
          <div id="strikeBar" class="strike-bar"><i id="strikeFill"></i></div>
          <div id="tensionTrack" class="tension-track">
            <i id="tensionBand" class="band"></i>
            <b id="tensionPill" class="pill"></b>
          </div>
          <div class="progress"><i id="reelProgress"></i></div>
          <div class="progress escape"><i id="reelEscape"></i></div>
        </div>
        <b id="reelName" class="reel-name"></b>
        <p id="reelHint" class="reel-hint"></p>
      </div>
    </div>
    <div class="card">
      <div class="tally" id="tally"></div>
      <div class="log" id="log"></div>
    </div>
  </div>
</div>

<div id="armorModal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <b>Armor skills</b>
      <button id="armorClose" class="go">Close</button>
    </div>
    <div id="armorBody"></div>
  </div>
</div>

<script src="data/ores.js?v=268"></script>
<script src="data/fish.js?v=268"></script>
<script src="data/locales.js?v=268"></script>
<script src="data/meals.js?v=268"></script>
<script src="data/canteen.js?v=268"></script>
<script src="data/armorlines.js?v=268"></script>
<!-- The bench reports what each skill DOES, not just its level, and the probes
     that know that live with the skill list. -->
<script src="../tools/skills-data.js?v=268"></script>
<script src="data/themes.js?v=268"></script>
<script src="theme.js?v=268"></script>
<script src="game.js?v=268"></script>
<script src="roll.js?v=268"></script>
<script src="fishing.js?v=268"></script>
<script src="../tools/bench.js"></script>
